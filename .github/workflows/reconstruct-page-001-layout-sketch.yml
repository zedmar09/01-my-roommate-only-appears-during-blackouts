name: Reconstruct Page 001 Layout Sketch

on:
  push:
    paths:
      - '.layout-upload/page-001/**'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check chunks
        id: chunks
        shell: bash
        run: |
          expected=6
          found=$(find .layout-upload/page-001 -maxdepth 1 -name 'chunk-*.b64' 2>/dev/null | wc -l)
          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [ "$found" -ne "$expected" ]; then
            echo "Waiting for all $expected chunks; currently have $found."
          fi
      - name: Reconstruct WebP and commit
        if: steps.chunks.outputs.found == '6'
        shell: bash
        run: |
          mkdir -p manga/04-production/arc-01/chapter-001
          cat .layout-upload/page-001/chunk-*.b64 | base64 -d > manga/04-production/arc-01/chapter-001/page-001-layout-sketch.webp
          file manga/04-production/arc-01/chapter-001/page-001-layout-sketch.webp
          rm -rf .layout-upload/page-001
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Page 001 layout sketch WebP' || exit 0
          git push
